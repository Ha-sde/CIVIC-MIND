name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check frontend JavaScript syntax
        run: node --check frontend/js/app.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t civic-mind:ci .
      - name: Smoke test container
        run: |
          docker run -d --name cm -p 8000:8000 -e SEED_DEMO=true civic-mind:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break || sleep 2; done
          curl -fs http://localhost:8000/api/public/stats
          docker rm -f cm
